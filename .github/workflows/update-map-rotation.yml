name: Update Map Rotation

on:
  # GitHub Actionsのschedule(cron)は混雑時に数十分単位で遅延することがあるため、
  # Cloudflare Workers の Cron Trigger から workflow_dispatch を叩く方式に変更した。
  # (詳細: Cloudflareダッシュボード apex-map-rotation-trigger Worker, Cron Trigger */10 * * * *)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-map-rotation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch ranked map rotation from tas.gg
        env:
          TAS_TWITCH_ID: ${{ secrets.TAS_TWITCH_ID }}
        run: |
          set -euo pipefail
          mkdir -p data

          if [ -z "${TAS_TWITCH_ID:-}" ]; then
            echo "::error::TAS_TWITCH_ID secret is not set. Add it in repo Settings > Secrets and variables > Actions."
            exit 1
          fi

          # tas.gg側の一時的な通信エラー(curl失敗)や、応答内容の揺れ(次マップ情報の欠落など)に
          # 備えて、最大2回(初回+1リトライ)まで取得・解析を試みる
          CURRENT_MAP=""
          NEXT_MAP=""
          REMAIN_RAW=""
          for attempt in 1 2; do
            if TEXT="$(curl -sf "https://cmds.tas.gg/${TAS_TWITCH_ID}/maps?br_ranked&shownext&lang=jp")"; then
              echo "Fetched (attempt $attempt): $TEXT"

              # tas.ggはエラー時もHTTP 200でプレーンテキストのエラーメッセージを返すため、内容で判定する
              if ! echo "$TEXT" | grep -qi "not found\|error"; then
                # 例: "= 現在のマップスケジュール = | BRランク: E-District (残り38 分) - 次のマップ: ワールズエッジ | (- 運営元：TAS.gg -)"
                CURRENT_MAP="$(echo "$TEXT" | grep -oP '(?<=BRランク: ).*?(?=\s*\()' || true)"
                REMAIN_RAW="$(echo "$TEXT" | grep -oP '(?<=\().*?(?=\))' | head -1 || true)"
                NEXT_MAP="$(echo "$TEXT" | grep -oP '(?<=次のマップ: ).*?(?=\s*\|)' || true)"
              fi
            else
              echo "curl failed on attempt $attempt (exit code $?)"
            fi

            if [ -n "$CURRENT_MAP" ] && [ -n "$NEXT_MAP" ] && [ -n "$REMAIN_RAW" ]; then
              break
            fi

            CURRENT_MAP=""; NEXT_MAP=""; REMAIN_RAW=""
            if [ "$attempt" -eq 1 ]; then
              echo "::warning::Attempt 1 failed, retrying in 10s..."
              sleep 10
            fi
          done

          if [ -z "$CURRENT_MAP" ] || [ -z "$NEXT_MAP" ] || [ -z "$REMAIN_RAW" ]; then
            echo "::error::Failed to fetch/parse tas.gg response after retry: ${TEXT:-<no response>}"
            exit 1
          fi

          # "残り38 分" や(想定される)"残り1時間30分"のような表記の両方に対応するため、
          # 時間・分をそれぞれ抽出して合計分数に変換する
          REMAIN_HOURS="$(echo "$REMAIN_RAW" | grep -oP '\d+(?=\s*時間)' | head -1 || true)"
          REMAIN_MINS="$(echo "$REMAIN_RAW" | grep -oP '\d+(?=\s*分)' | head -1 || true)"

          if [ -z "$REMAIN_HOURS" ] && [ -z "$REMAIN_MINS" ]; then
            echo "::error::Could not extract remaining time from: $REMAIN_RAW"
            exit 1
          fi

          REMAIN_MIN=$(( ${REMAIN_HOURS:-0} * 60 + ${REMAIN_MINS:-0} ))

          NEW_JSON="$(jq -n \
            --arg currentMap "$CURRENT_MAP" \
            --arg nextMap "$NEXT_MAP" \
            --argjson remainingMinutesAtFetch "$REMAIN_MIN" \
            '{currentMap: $currentMap, nextMap: $nextMap, remainingMinutesAtFetch: $remainingMinutesAtFetch}')"

          OLD_JSON="$( [ -f data/maprotation.json ] && jq '{currentMap, nextMap}' data/maprotation.json 2>/dev/null || echo '{}' )"
          NEW_COMPARE="$(echo "$NEW_JSON" | jq '{currentMap, nextMap}')"

          if [ "$NEW_COMPARE" != "$OLD_JSON" ]; then
            echo "$NEW_JSON" | jq --arg fetchedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '. + {fetchedAt: $fetchedAt}' > data/maprotation.json
            echo "CHANGED=1" >> "$GITHUB_ENV"
          else
            echo "No change in ranked map rotation. Skipping commit."
          fi

      - name: Fetch ranked split time-left from tas.gg
        env:
          TAS_TWITCH_ID: ${{ secrets.TAS_TWITCH_ID }}
        run: |
          set -euo pipefail
          mkdir -p data

          # こちらも同様に、最大2回(初回+1リトライ)まで取得・解析を試みる
          SPLIT_WEEKS=""; SPLIT_DAYS=""; SPLIT_HOURS=""; SPLIT_MINS=""
          for attempt in 1 2; do
            if TEXT="$(curl -sf "https://cmds.tas.gg/${TAS_TWITCH_ID}/timeleft?lang=jp")"; then
              echo "Fetched (split, attempt $attempt): $TEXT"

              if ! echo "$TEXT" | grep -qi "not found\|error"; then
                # 例: "= ランクスプリットの残り時間 = | 現在のランクスプリットの残り時間は2 週間, 5 日, 6 時間, 36 分です。 | (- 運営元：TAS.gg -)"
                SPLIT_WEEKS="$(echo "$TEXT" | grep -oP '\d+(?=\s*週間)' | head -1 || true)"
                SPLIT_DAYS="$(echo "$TEXT" | grep -oP '\d+(?=\s*日)' | head -1 || true)"
                SPLIT_HOURS="$(echo "$TEXT" | grep -oP '\d+(?=\s*時間)' | head -1 || true)"
                SPLIT_MINS="$(echo "$TEXT" | grep -oP '\d+(?=\s*分)' | head -1 || true)"
              fi
            else
              echo "curl failed on attempt $attempt (exit code $?)"
            fi

            if [ -n "$SPLIT_WEEKS" ] || [ -n "$SPLIT_DAYS" ] || [ -n "$SPLIT_HOURS" ] || [ -n "$SPLIT_MINS" ]; then
              break
            fi

            if [ "$attempt" -eq 1 ]; then
              echo "::warning::Attempt 1 failed, retrying in 10s..."
              sleep 10
            fi
          done

          if [ -z "$SPLIT_WEEKS" ] && [ -z "$SPLIT_DAYS" ] && [ -z "$SPLIT_HOURS" ] && [ -z "$SPLIT_MINS" ]; then
            echo "::error::Failed to fetch/parse split time-left after retry: ${TEXT:-<no response>}"
            exit 1
          fi

          SPLIT_TOTAL_MIN=$(( ${SPLIT_WEEKS:-0} * 7 * 24 * 60 + ${SPLIT_DAYS:-0} * 24 * 60 + ${SPLIT_HOURS:-0} * 60 + ${SPLIT_MINS:-0} ))
          SPLIT_FETCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SPLIT_END_EPOCH=$(( $(date -u -d "$SPLIT_FETCHED_AT" +%s) + SPLIT_TOTAL_MIN * 60 ))
          # 取得のたびに数分単位で揺れる（残り時間は分単位でしか取れない）ため、
          # 5分単位に丸めて、実際にスプリットが延長/終了しない限りコミットが増えないようにする
          SPLIT_END_EPOCH_ROUNDED=$(( (SPLIT_END_EPOCH + 150) / 300 * 300 ))
          SPLIT_END_AT="$(date -u -d "@$SPLIT_END_EPOCH_ROUNDED" +%Y-%m-%dT%H:%M:%SZ)"

          NEW_SPLIT_JSON="$(jq -n --arg splitEndAt "$SPLIT_END_AT" '{splitEndAt: $splitEndAt}')"
          OLD_SPLIT_JSON="$( [ -f data/splitend.json ] && jq '{splitEndAt}' data/splitend.json 2>/dev/null || echo '{}' )"

          if [ "$NEW_SPLIT_JSON" != "$OLD_SPLIT_JSON" ]; then
            echo "$NEW_SPLIT_JSON" | jq --arg fetchedAt "$SPLIT_FETCHED_AT" '. + {fetchedAt: $fetchedAt}' > data/splitend.json
            echo "SPLIT_CHANGED=1" >> "$GITHUB_ENV"
          else
            echo "No change in ranked split end time. Skipping commit."
          fi

      - name: Commit and push if changed
        if: env.CHANGED == '1' || env.SPLIT_CHANGED == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          MSG_PARTS=""
          if [ "${CHANGED:-}" = "1" ]; then
            git add data/maprotation.json
            MSG_PARTS="map rotation"
          fi
          if [ "${SPLIT_CHANGED:-}" = "1" ]; then
            git add data/splitend.json
            MSG_PARTS="${MSG_PARTS:+$MSG_PARTS, }split end time"
          fi

          git commit -m "chore: update ranked $MSG_PARTS data"
          git push
